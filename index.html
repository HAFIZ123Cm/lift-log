<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<meta name="description" content="Gym log with progressive overload reminders, rest timer, journal and an AI coach.">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --card2:#eef0f3; --line:#dfe2e7; --text:#14161a; --muted:#5d6470; --faint:#8a909b;
  --accent:#ea580c; --accent-ink:#ffffff; --accent-soft:#fff1e8; --good:#15803d; --good-soft:#e6f6ec; --bad:#b91c1c;
  --c-push:#ea580c; --c-pull:#2563eb; --c-legs:#16a34a; --c-upper:#7c3aed; --c-lower:#0d9488;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115; --card:#181b21; --card2:#20242c; --line:#2b3039; --text:#eef0f3; --muted:#a3aab5; --faint:#727986;
    --accent:#fb7a2e; --accent-ink:#1a0d04; --accent-soft:#2a1a10; --good:#4ade80; --good-soft:#12261a; --bad:#f87171;
    --c-push:#fb7a2e; --c-pull:#60a5fa; --c-legs:#4ade80; --c-upper:#a78bfa; --c-lower:#2dd4bf;
    --shadow:none; color-scheme:dark;
  }
  .badge{color:#0f1115}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:-.01em}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.pill{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.done{background:var(--good);color:#fff}
.hidden{display:none!important}
main{padding-top:12px}
section.tab{display:none}
section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:11.5px}
h2{font-size:17px;margin:0 0 6px} h3{font-size:15px;margin:0}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){.seg button.on{background:#2d323c}}
input[type=text],input[type=number],input[type=url],input[type=password],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;text-align:center;color:var(--faint);font-weight:700;padding-bottom:2px}
.cal .d{aspect-ratio:1/1.08;border:1px solid transparent;border-radius:10px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;position:relative;min-width:0}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--accent)}
.cal .d.sel{background:var(--accent);color:var(--accent-ink)}
.cal .d.sel .tag{color:var(--accent-ink)!important}
.cal .d .n{font-weight:700;font-size:14px;line-height:1}
.cal .d .tag{font-size:9.5px;font-weight:700;letter-spacing:.02em;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .d .ok{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--good)}
.cal .d.sel .ok{background:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* session */
.day-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;color:#fff}
.ex{padding:12px 12px 10px}
.ex-head{display:flex;gap:8px;align-items:flex-start}
.ex-head .nm{flex:1;min-width:0}
.ex-head .nm b{font-size:15.5px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.chip.p{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.last{margin-top:9px;border-radius:10px;background:var(--good-soft);padding:8px 10px;font-size:13px}
.last .lt{font-weight:700;color:var(--good);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.last.none{background:var(--card2);color:var(--muted)}
.sets{margin-top:10px;display:grid;grid-template-columns:26px 1fr 1fr 42px;gap:6px;align-items:center}
.sets .h{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.sets .no{font-weight:700;color:var(--muted);text-align:center}
.inp{position:relative}
.inp input{padding-right:46px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.inp span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--faint);pointer-events:none}
.tick{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:18px;color:var(--faint)}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.ex-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.ex-foot select{width:auto;padding:6px 8px;font-size:13px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .sh-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:-16px;background:var(--bg);padding:6px 0;z-index:2}
.sheet .sh-head h2{flex:1;margin:0}
.guide h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.guide ol,.guide ul{margin:0;padding-left:20px}
.guide li{margin:4px 0}
.mist{border-left:3px solid var(--bad);background:var(--card);border-radius:0 10px 10px 0;padding:8px 10px;margin:7px 0;font-size:14px}
.mist b{color:var(--bad)}
.tipbox{background:var(--accent-soft);border-radius:10px;padding:10px;margin-top:12px;font-size:14px}
.plan-ex{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan-ex:last-child{border-bottom:0}
.plan-ex .nm{flex:1;min-width:0}
.mini{border:1px solid var(--line);background:var(--card2);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;font-size:14px}
.weekgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}

/* timer */
.timer{display:flex;flex-direction:column;align-items:center;padding:18px 14px}
.ring{position:relative;width:min(72vw,270px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(46px,15vw,64px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .s{position:absolute;left:0;right:0;bottom:24%;text-align:center;font-size:13px;color:var(--muted)}
.tbtns{display:flex;gap:10px;margin-top:16px;width:100%;max-width:320px}
.tbtns .btn{flex:1;padding:14px;font-size:17px;border-radius:14px}
.durs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.durs button{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.durs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.switch{display:flex;align-items:center;gap:10px;justify-content:space-between}
.switch input{width:44px;height:26px;appearance:none;background:var(--line);border-radius:999px;position:relative;flex:none;transition:.2s}
.switch input::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}

/* journal */
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:6px 10px;font-size:14px}
.moods button.on{border-color:var(--accent);background:var(--accent-soft)}
.jlist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px}
.jlist button:last-child{border-bottom:0}

/* advisor */
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14.5px;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{border-color:var(--bad);color:var(--bad)}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px;resize:none}
.qchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.qchips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px}
details.card summary{cursor:pointer;font-weight:700;list-style:none}
details.card summary::-webkit-details-marker{display:none}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--card2);border-radius:8px;padding:8px;white-space:pre;overflow:auto;max-height:180px}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .wrap{display:flex;padding:0}
nav.bottom button{flex:1;border:0;background:transparent;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--faint)}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 id="title">Workout</h1>
  <button class="pill hidden" id="miniTimer" aria-label="Open rest timer"></button>
  <button class="icon-btn" id="gear" aria-label="Settings and backup">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</div></header>

<main class="wrap">
  <section class="tab on" id="tab-workout"></section>
  <section class="tab" id="tab-timer"></section>
  <section class="tab" id="tab-journal"></section>
  <section class="tab" id="tab-advisor"></section>
</main>

<nav class="bottom"><div class="wrap">
  <button data-tab="workout" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Workout</button>
  <button data-tab="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>Timer</button>
  <button data-tab="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>Journal</button>
  <button data-tab="advisor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>Advisor</button>
</div></nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
